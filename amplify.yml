version: 1
backend:
  phases:
    build:
      commands:
        - |
          if [ -d node_modules ]; then
            echo "node_modules restored from cache, skipping full install"
            npm install --prefer-offline --no-audit --no-fund 2>/dev/null || npm ci
          else
            npm ci
          fi
        - npm install @parcel/watcher-linux-x64-glibc@2.5.1 --no-save
        - node scripts/patch-amplify-schema.cjs
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - |
          if [ -d node_modules ]; then
            echo "node_modules restored from cache, skipping full install"
            npm install --prefer-offline --no-audit --no-fund 2>/dev/null || npm ci
          else
            npm ci
          fi
        - npm run update-commit-hash
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/admin/browser
    files:
      - "**/*"
  cache:
    paths:
      - "node_modules/**/*"
      - ".angular/cache/**/*"
