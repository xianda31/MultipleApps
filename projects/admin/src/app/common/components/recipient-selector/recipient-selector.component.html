<div>
  <div class="border rounded p-2">
    <div class="d-flex flex-wrap gap-3 align-items-center mb-2">
      <div class="form-check mb-0">
        <input class="form-check-input" type="checkbox" [id]="'all-members-' + uniqueId"
          [checked]="allSelected" [indeterminate]="selectionIndeterminate"
          (change)="toggleAllMembers($any($event.target).checked)"
          aria-label="Sélectionner ou désélectionner tous les membres"
          title="Sélectionner ou désélectionner tous les membres">
      </div>
      <input class="form-control form-control-sm" [(ngModel)]="filterText"
        placeholder="Filtrer…" style="max-width:200px">
      <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" role="switch"
          [id]="'selected-only-' + uniqueId" [(ngModel)]="showSelectedOnly">
        <label class="form-check-label small" [for]="'selected-only-' + uniqueId">
          Voir les sélectionnés uniquement
        </label>
      </div>
    </div>

    <div style="max-height:220px;overflow-y:auto">
      @for (m of filteredMembers; track m.id) {
        <div class="form-check py-1 border-bottom">
          <input class="form-check-input" type="checkbox"
            [id]="'mbr-' + m.id"
            [checked]="isSelected(m.id)"
            [disabled]="!m.accept_mailing"
            (change)="toggleMember(m.id)">
          <label class="form-check-label small w-100" [for]="'mbr-' + m.id"
            [class.text-muted]="!m.accept_mailing">
            {{ m.lastname }} {{ m.firstname }}
            <span class="text-muted ms-1">{{ m.email }}</span>
            @if (!m.accept_mailing) {
              <span class="badge bg-secondary ms-1">refus mailing</span>
            }
          </label>
        </div>
      }
      @if (filteredMembers.length === 0) {
        <div class="text-muted small p-2">
          {{ showSelectedOnly ? 'Aucun membre sélectionné' : 'Aucun résultat' }}
        </div>
      }
    </div>

    <div class="text-muted small">
      {{ selectedCount }} sélectionné(s) · {{ activeMailingCount }} acceptent les mailings
      sur {{ members.length }} membres
    </div>
  </div>
</div>
