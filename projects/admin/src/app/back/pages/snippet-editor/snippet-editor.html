<form [formGroup]="form">

    <div *ngIf="missingFields.length" class="alert alert-warning py-2 mb-3" role="status">
        <i class="bi bi-exclamation-triangle me-1"></i>
        Article incomplet :
        <strong>{{ missingFieldLabels }}</strong>
    </div>

    <h6 class="mt-1"><i class="bi bi-gear-fill me-2"></i>Contenu</h6>
    <div class="row align-items-stretch">
        <div class="col-8 d-flex flex-column justify-content-between">
            <label class="form-label form-label-sm mb-0">Titre <span *ngIf="isFieldRequired('title')" class="text-danger">*</span></label>
            <input type="text" formControlName="title" class="form-control form-control-sm mb-1"
                placeholder="Titre de l'article" (blur)="saveSnippetSelected()" (keyup.enter)="onEnterSave($event)">
            <ng-container *ngIf="isFieldVisible('subtitle')">
                <label class="form-label form-label-sm mb-0">Sous-titre</label>
                <input type="text" formControlName="subtitle" class="form-control form-control-sm text-muted mb-1"
                    placeholder="Sous-titre de l'article" (blur)="saveSnippetSelected()" (keyup.enter)="onEnterSave($event)">
            </ng-container>
        </div>
        <div class="col-4 d-flex align-items-center justify-content-center">
            <img *ngIf="snippet && snippet.image_url" [src]="snippet.image_url"
                alt="{{ form.get('title')?.value }}" class="img-fluid snippet-img-limited">
            <div *ngIf="form.get('image')?.value && (!snippet || !snippet.image_url)" class="text-muted small">
                <i class="bi bi-hourglass-split"></i> Chargement...
            </div>
        </div>
    </div>

    <div *ngIf="isFieldVisible('content')" class="form-label text-muted mb-0 mt-2">
        <button type="button" class="btn btn-sm btn-outline-success " (click)="snippet && onSnippetContentClick(snippet)">
            <i class="bi bi-pencil-square"></i> Modifier le contenu
            <span *ngIf="isFieldRequired('content')" class="text-danger">*</span>
        </button>
    </div>

    <h6 class="mt-3"><i class="bi bi-gear-fill me-2"></i>Paramètres de publication</h6>

    <div *ngIf="isFieldVisible('publishedAt')" class="mt-2 d-flex flex-row align-items-center gap-3">
        <span class="form-label text-muted mb-0">Publié le (sinon aujourd'hui):</span>
        <input type="date" formControlName="publishedAt" class="form-control form-control-sm d-inline-block w-auto"
            (keydown.enter)="saveSnippetSelected()" (change)="saveSnippetSelected()" placeholder="publication">
    </div>

    <div class="mt-2 d-flex flex-row align-items-center gap-3">
        <div *ngIf="isFieldVisible('public')" class="form-check form-switch mb-0 d-flex flex-row align-items-center">
            <input [formControlName]="'public'" (change)="onToggleChange('public', $event.target.checked)"
                [ngClass]="form.get('public')?.value ? 'bg-success' : 'bg-light'" class="form-check-input"
                style="width: 3em; height: 1.5em;" type="checkbox" role="switch">
            <label class="form-check-label text-muted ms-2">Visible sans connexion</label>
        </div>
        <div *ngIf="isFieldVisible('featured')" class="form-check form-switch mb-0 d-flex flex-row align-items-center">
            <input [formControlName]="'featured'" (change)="onToggleChange('featured', $event.target.checked)"
                [ngClass]="form.get('featured')?.value ? 'bg-success' : 'bg-light'" class="form-check-input"
                style="width: 3em; height: 1.5em;" type="checkbox" role="switch">
            <label class="form-check-label text-muted ms-2">à la une</label>
        </div>
    </div>

    <h6 *ngIf="isFieldVisible('image') || isFieldVisible('file') || isFieldVisible('folder')" class="mt-3">
        <i class="bi bi-paperclip me-2"></i>Médias associés
    </h6>

    <!-- image url input with selection button -->
    <div *ngIf="isFieldVisible('image')" class="form-label mb-0 mt-2">
        <label class="mb-1">Illustration <span *ngIf="isFieldRequired('image')" class="text-danger">*</span></label>
        <div class="d-flex align-items-center gap-2">
            <input class="form-control form-control-sm" 
                   [value]="form.get('image')?.value ? getNameFromPath(form.get('image')?.value) : 'Aucune image'" 
                   readonly>
            <button type="button" class="btn btn-outline-success btn-sm" (click)="requestImageSelection()">
                <i class="bi bi-images me-1"></i>Choisir ou importer
            </button>
        </div>
    </div>


    <!-- file url input with selection button -->
    <div *ngIf="isFieldVisible('file')" class="form-label mb-0 mt-2">
        <label class="mb-1">Fichier à télécharger <span *ngIf="isFieldRequired('file')" class="text-danger">*</span></label>
        <div class="d-flex align-items-center gap-2">
            <input class="form-control form-control-sm"
                   [value]="form.get('file')?.value ? getNameFromPath(form.get('file')?.value) : 'Aucun fichier'"
                   readonly>
            <button type="button" class="btn btn-outline-success btn-sm" (click)="requestFileSelection()">
                <i class="bi bi-file-earmark-arrow-up me-1"></i>Choisir ou importer
            </button>
        </div>
    </div>


    <!-- folder selector (albums) with selection button -->
    <div *ngIf="isFieldVisible('folder')" class="form-label mb-0 mt-2">
        <label class="mb-1">Album photo <span *ngIf="isFieldRequired('folder')" class="text-danger">*</span></label>
        <div class="d-flex align-items-center gap-2">
            <input class="form-control form-control-sm"
                   [value]="form.get('folder')?.value ? getNameFromPath(form.get('folder')?.value) : 'Aucun dossier'"
                   readonly>
            <button type="button" class="btn btn-outline-success btn-sm" (click)="requestFolderSelection()">
                <i class="bi bi-folder-plus me-1"></i>Choisir ou importer
            </button>
        </div>
    </div>
    
</form>
