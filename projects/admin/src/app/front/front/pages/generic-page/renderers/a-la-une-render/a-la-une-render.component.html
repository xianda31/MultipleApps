<div [ngClass]="rowCols()" [class.compact-news]="compact">
  @for (snippet of snippets; track snippet.id) {
  <div class="col">
    <div class="card nice_shadow" [class.recent-highlight]="isRecentHighlight(snippet)"
      [class.card-shine]="isRecentHighlight(snippet)" id="{{snippet.title}}">
      <div class="card-body">
        <div class="row g-0">
          <div class="snippet-heading d-flex align-items-stretch mb-2">
            <div class="snippet-media">
              <div class="inline-image-frame">
                <img [src]="snippet.image_url" alt="{{snippet.title}}" class="card-img-top">
              </div>
              <div class="snippet-date text-muted">{{snippet.publishedAt | date:'shortDate'}}</div>
            </div>
            <div class="snippet-heading-content flex-grow-1 text-center">
              <div class="snippet-headings">
                @if (isRecentHighlight(snippet)) {
                <div class="recent-highlight-badge">
                  <i class="bi bi-bell-fill" aria-hidden="true"></i>
                  Récent
                </div>
                }
                @if (snippet.subtitle) {
                <div class="snippet-subtitle text-primary fw-bolder">{{snippet.subtitle}}</div>
                }
                <h5 class="snippet-title text-success fw-bolder mb-1">{{snippet.title}}</h5>
              </div>
            </div>
          </div>
          <div class="card-text  col-12">
            <div #clampContainer class="clamp-container">
              <span #clampRef class="card-text tighter-html" [innerHTML]="stringToSafeHtml(snippet.content)"
                [ngStyle]="getClampStyle(snippet.id)"></span>
            </div>
            <ng-container *ngIf="read_more && (snippet.content.length > TRUNCATE_LIMIT + TRUNCATE_HYSTERISIS)">
              <span (click)="readMore(snippet)" class="text-info ms-1" style="cursor:pointer;display:inline">
                <span *ngIf="!isExpanded(snippet.id)">... Lire la suite</span>
                <span *ngIf="isExpanded(snippet.id)">↑ Replier</span>
              </span>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
  }
</div>
