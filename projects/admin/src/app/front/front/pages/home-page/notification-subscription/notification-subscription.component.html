@if (visible) {
<div class="notification-subscription-backdrop" role="presentation">
  <section class="notification-subscription-dialog card shadow-lg" role="dialog"
    aria-labelledby="notification-title" aria-describedby="notification-description">
    <div class="card-body p-3">
      <div class="d-flex align-items-start gap-2 mb-2">
        <div class="notification-subscription-icon" aria-hidden="true">
          <i class="bi bi-bell-fill"></i>
        </div>
        <div>
          <h5 id="notification-title" class="mb-1">Restez informé de la vie du club</h5>
          <p id="notification-description" class="small text-muted mb-0">
            Choisissez les notifications que vous souhaitez recevoir sur ce navigateur.
          </p>
        </div>
      </div>

      <div class="vstack gap-2 mb-3">
        <label class="notification-subscription-choice">
          <span>
            <strong>Actualités du club</strong>
            <small>Nouvelles publications ajoutées à la page d’accueil.</small>
          </span>
          <span class="form-check form-switch m-0">
            <input class="form-check-input" type="checkbox" role="switch" [(ngModel)]="news"
              [disabled]="permissionBlocked || requestingPermission"
              aria-label="Recevoir les actualités du club">
          </span>
        </label>

        <label class="notification-subscription-choice">
          <span>
            <strong>Recherches de partenaire</strong>
            <small>Un joueur cherche un partenaire pour un tournoi.</small>
          </span>
          <span class="form-check form-switch m-0">
            <input class="form-check-input" type="checkbox" role="switch" [(ngModel)]="partner"
              [disabled]="permissionBlocked || requestingPermission"
              aria-label="Recevoir les recherches de partenaire">
          </span>
        </label>

        <label class="notification-subscription-choice">
          <span>
            <strong>Alertes importantes <span class="badge text-bg-light ms-1">Recommandé</span></strong>
            <small>Report, annulation ou changement exceptionnel.</small>
          </span>
          <span class="form-check form-switch m-0">
            <input class="form-check-input" type="checkbox" role="switch" [(ngModel)]="alerts"
              [disabled]="permissionBlocked || requestingPermission"
              aria-label="Recevoir les alertes importantes">
          </span>
        </label>
      </div>

      @if (errorMessage) {
      <div class="alert alert-warning py-2" role="alert">
        {{ errorMessage }}
      </div>
      }

      <div class="d-flex flex-wrap justify-content-end gap-2">
        <button type="button" class="btn btn-sm btn-link text-secondary" (click)="decline()"
          [disabled]="requestingPermission">
          Non merci
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="decideLater()"
          [disabled]="requestingPermission">
          Plus tard
        </button>
        <button type="button" class="btn btn-sm btn-primary" (click)="activate()"
          [disabled]="!hasSelection || permissionBlocked || requestingPermission">
          @if (requestingPermission) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
          }
          Activer la sélection
        </button>
      </div>
    </div>
  </section>
</div>
}
