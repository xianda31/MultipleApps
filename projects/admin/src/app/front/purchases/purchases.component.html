<main class="purchases-page">
    <header class="purchases-header">
        <div>
            <h1>Mes achats</h1>
            <p>{{member_full_name}} · saison {{season}}</p>
        </div>
        <app-purchase-summary
            class="purchases-summary"
            aria-label="Résumé du compte"
            [entries]="purchase_entries"
            [assets]="avoirs">
        </app-purchase-summary>
    </header>

    @if (loading$ | async) {
        <div class="purchases-loading">
            <span class="spinner-border spinner-border-sm" role="status"></span>
            Chargement de vos achats...
        </div>
    } @else {
        <app-purchase-statement [entries]="purchase_entries"></app-purchase-statement>
    }
</main>
